version: 2.1

jobs:
  php82:
    docker:
      - image: cimg/php:8.2
    steps:
      - checkout
      - run: composer require phpunit/phpunit --dev
      - run: php vendor/bin/phpunit
  php83:
    docker:
      - image: cimg/php:8.3
    steps:
      - checkout
      - run: composer require phpunit/phpunit --dev
      - run: php vendor/bin/phpunit
  php84:
    docker:
      - image: cimg/php:8.4
    steps:
      - checkout
      - run: composer require phpunit/phpunit --dev
      - run: php vendor/bin/phpunit

workflows:
  version: 2
  workflow:
    jobs:
      - php82
      - php83
      - php84
